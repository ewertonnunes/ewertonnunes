# ProjectSpec - the single source of truth for the deploy-agent project.
#
# This file fully describes the project: name, deps, modules, templates,
# policies. The generator reads this + the files/ directory and renders
# the entire project deterministically. Change here, regenerate, commit.
#
# Schema is validated by scripts/spec_schema.py before anything is written.

project:
  name: deploy-agent
  version: "0.1.0"
  description: "Deterministic LLM agent for Kubernetes deployments"
  python_version: "3.11"
  python_requires: ">=3.11"
  license: "Apache-2.0"

modules:
  - schemas       # Pydantic schemas - the determinism contract
  - extractor     # LLM call with forced tool use
  - renderer      # Jinja2 manifest rendering
  - validator     # YAML + OPA + drift checks
  - git_ops       # PR creation for GitOps flow
  - audit         # Append-only audit log

cli:
  entry_point: deploy_agent.__main__:main
  command: deploy-agent

templates:
  - deployment
  - service

policies:
  - deployment       # OPA rules for Kubernetes deployments

evals:
  cases_file: golden_cases.yaml
  min_cases: 5      # CI fails if fewer than this

runtime_dependencies:
  - "anthropic>=0.40"
  - "pydantic>=2.7"
  - "jinja2>=3.1"
  - "pyyaml>=6.0"

dev_dependencies:
  - "pytest>=8"
  - "pytest-cov>=5"
  - "ruff>=0.6"
  - "mypy>=1.10"
  - "types-PyYAML"

model:
  default: "claude-sonnet-4-6"
  max_retries: 3
  temperature: 0

ci:
  python_versions: ["3.12"]
  conftest_version: "0.56.0"
  run_evals_on_pr: true
